<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-label="Design, Engineer, Launch, Evolve">
<defs>
<linearGradient id="track" x1="0" x2="1"><stop offset="0" stop-color="#234854"/><stop offset="1" stop-color="#2F6170"/></linearGradient>
<radialGradient id="pulse"><stop offset="0" stop-color="#3EE283"/><stop offset="0.35" stop-color="#22D16B" stop-opacity="0.7"/><stop offset="1" stop-color="#22D16B" stop-opacity="0"/></radialGradient>
<radialGradient id="bg" cx="0.5" cy="0.4" r="0.7"><stop offset="0" stop-color="#101521"/><stop offset="1" stop-color="#07090F"/></radialGradient>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<rect width="1200" height="270" rx="16" fill="url(#bg)"/>
